<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-controls">
      <div class="skin-switch-wrap" title="Cambiar tema visual">
        <label for="skin-select" class="skin-label">SKIN</label>
        <select id="skin-select" aria-label="Seleccionar tema visual (skin)">
          <option value="retro">Retro</option>
          <option value="neon">Neon</option>
          <option value="pastel">Pastel</option>
          <option value="pixel">Pixel art</option>
        </select>
      </div>
      <div class="theme-switch-wrap" title="Cambiar tema">
        <span class="theme-icon">🌙</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle" aria-label="Alternar modo claro/oscuro" />
          <span class="slider"></span>
        </label>
        <span class="theme-icon">☀️</span>
      </div>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section highscores">
          <span class="label">RECORDS</span>
          <ol class="highscore-list" id="highscore-list"></ol>
          <div class="highscore-stats">
            <span>Mejor combo: <strong id="best-combo">0</strong></span>
            <span>Líneas máximas: <strong id="max-lines">0</strong></span>
          </div>
          <button id="reset-records-btn" class="reset-records-btn">Resetear records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="name-entry hidden">
          <label for="name-input">¡Nuevo record! Nombre:</label>
          <div class="name-entry-row">
            <input type="text" id="name-input" maxlength="12" placeholder="Jugador" autocomplete="off" />
            <button id="save-score-btn">Guardar</button>
          </div>
        </div>

        <div id="overlay-highscores" class="overlay-highscores hidden">
          <span class="label">TOP 5</span>
          <ol class="highscore-list" id="overlay-highscore-list"></ol>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>

        <div class="pause-buttons">
          <button id="resume-btn" class="menu-btn">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
          <button id="toggle-controls-btn" class="menu-btn">Ver controles</button>
        </div>

        <div class="pause-level">
          <label for="start-level-select">Nivel inicial</label>
          <select id="start-level-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>

        <ul id="pause-controls-list" class="controls-list hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
