<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-switch-wrap" title="Cambiar tema">
      <span class="theme-icon">🌙</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle" aria-label="Alternar modo claro/oscuro" />
        <span class="slider"></span>
      </label>
      <span class="theme-icon">☀️</span>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section records-panel">
          <span class="label">RECORDS</span>
          <ol id="records-list" class="records-list"></ol>
          <div class="stats-row">
            <span>Mejor combo: <strong id="best-combo">0</strong></span>
            <span>Líneas máx: <strong id="max-lines">0</strong></span>
          </div>
          <button id="reset-records-btn" class="reset-records-btn">Resetear récords</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-stats"></p>
        <div id="save-score-wrap" class="save-score-wrap hidden">
          <p class="new-record-msg">¡Puntuación de récord! Introduce tu nombre:</p>
          <div class="save-score-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Jugador" />
            <button id="save-score-btn">Guardar</button>
          </div>
        </div>
        <ol id="overlay-records-list" class="records-list"></ol>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
